name: Bug report / Fallo
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ Security issues (anything that could delete protected data) → use **Security → Report a vulnerability**, not this form."
  - type: textarea
    id: what
    attributes:
      label: What happened / Qué pasa
      description: What you did, what you expected, what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos
  - type: input
    id: version
    attributes:
      label: Airy and macOS version
      placeholder: "Airy 0.2.0 · macOS 15.x · Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      render: text
